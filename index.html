  function aiCreativeTrial(item, phase) {
    const stageDuration = phase === "practice" ? CONFIG.creativePracticeStageMs : CONFIG.creativeFormalStageMs;
    const allowEarlyFinish = phase === "practice";
    const suggestions = shuffle(item.suggestions.map(suggestion => ({ ...suggestion })));
    return {
      type: jsPsychHtmlKeyboardResponse,
      choices: "NO_KEYS",
      stimulus: '<div id="creative-root"></div>',
      data: baseData("AI_CREATIVE", phase, {
        itemId: item.id,
        itemTitle: item.title,
        promptText: item.prompt,
        aiSuggestionsJson: JSON.stringify(suggestions.map(suggestion => suggestion.text)),
        aiSuggestionQualitiesJson: JSON.stringify(suggestions.map(suggestion => suggestion.quality)),
        independentTimeLimitMs: stageDuration,
        revisionTimeLimitMs: stageDuration,
        earlyFinishAllowed: allowEarlyFinish
      }),
      on_load: function() {
        const root = document.getElementById("creative-root");
        const wholeStart = performance.now();
        let stageStart = wholeStart;
        let stage = 1;
        let initialText = "";
        let independentElapsed = null;
        let revisionElapsed = null;
        let manualStageAdvance = false;
        let finished = false;
        let interval = null;
        let deadline = stageStart + stageDuration;

        function renderStage1() {
          root.innerHTML = `
            <section class="gait-card">
              <div class="trial-head">
                <div><div class="module-pill">先独立思考</div><h2 style="margin:0;">${escapeHTML(item.title)}</h2></div>
                <span id="creative-timer" class="timer"></span>
              </div>
              <div class="material-box"><strong>任务：</strong>${escapeHTML(item.prompt)}</div>
              <label class="field-label" for="creative-initial">你的独立方案</label>
              <textarea id="creative-initial" maxlength="1200" placeholder="尽量写清楚方案怎么做、为什么可能有效。不要填写真实姓名或学校名称。"></textarea>
              <div class="range-labels"><span>请独立完成，不使用外部资料</span><span><strong id="initial-count">0</strong> 字</span></div>
              <div id="creative-error" class="error-text"></div>
              <button id="creative-stage-next" class="gait-btn" type="button" ${allowEarlyFinish ? "disabled" : 'style="display:none"'}>提前进入 AI 建议阶段</button>
              ${allowEarlyFinish ? "" : '<p class="muted small">正式任务采用固定时长，倒计时结束后自动进入下一阶段。</p>'}
            </section>
          `;
          const input = document.getElementById("creative-initial");
          input.focus();
          input.addEventListener("input", () => { document.getElementById("initial-count").textContent = input.value.trim().length; });
          if (allowEarlyFinish) {
            document.getElementById("creative-stage-next").addEventListener("click", () => advanceToStage2(true));
            setTimeout(function() {
              const button = document.getElementById("creative-stage-next");
              if (button) button.disabled = false;
            }, Math.min(30000, stageDuration * 0.35));
          }
        }

        function advanceToStage2(manual) {
          if (stage !== 1 || finished) return;
          const input = document.getElementById("creative-initial");
          initialText = input ? input.value.trim() : "";
          const elapsed = performance.now() - stageStart;
          if (manual && initialText.length < 10) {
            document.getElementById("creative-error").textContent = "请先写出至少 10 个字的独立方案。";
            return;
          }
          manualStageAdvance = manual;
          independentElapsed = elapsed;
          stage = 2;
          stageStart = performance.now();
          deadline = stageStart + stageDuration;
          renderStage2();
          updateTimer();
        }

        function renderStage2() {
          root.innerHTML = `
            <section class="gait-card">
              <div class="trial-head">
                <div><div class="module-pill">AI 协同修订</div><h2 style="margin:0;">${escapeHTML(item.title)}</h2></div>
                <span id="creative-timer" class="timer"></span>
              </div>
              <div class="material-box"><strong>原任务：</strong>${escapeHTML(item.prompt)}</div>
              <div class="ai-box">
                <div class="strong">以下是预先生成的 AI 建议，不要求全部采用：</div>
                ${suggestions.map((suggestion, index) => `
                  <label class="check-row">
                    <input type="checkbox" name="creative-suggestion" value="${index}">
                    <span>${escapeHTML(suggestion.text)}</span>
                  </label>
                `).join("")}
              </div>
              <label class="field-label" for="creative-revised">修订后的完整方案</label>
              <textarea id="creative-revised" maxlength="1500" placeholder="可以保留自己的想法，也可以选择性采纳或拒绝建议。"></textarea>
              <div class="range-labels"><span>请给出完整方案</span><span><strong id="revised-count">0</strong> 字</span></div>
              <label class="field-label" for="creative-reason">说明你保留、采纳或拒绝了什么，以及为什么 *</label>
              <textarea id="creative-reason" maxlength="600" placeholder="请说明你的判断依据。"></textarea>
              <div id="creative-error" class="error-text"></div>
              <button id="creative-submit" class="gait-btn" type="button" ${allowEarlyFinish ? "disabled" : 'style="display:none"'}>提交本题</button>
              ${allowEarlyFinish ? "" : '<p class="muted small">请继续完善方案；倒计时结束后系统会自动提交。</p>'}
            </section>
          `;
          const revised = document.getElementById("creative-revised");
          revised.value = initialText;
          document.getElementById("revised-count").textContent = revised.value.trim().length;
          revised.addEventListener("input", () => { document.getElementById("revised-count").textContent = revised.value.trim().length; });
          if (allowEarlyFinish) {
            document.getElementById("creative-submit").addEventListener("click", () => finish(false));
            setTimeout(function() {
              const button = document.getElementById("creative-submit");
              if (button) button.disabled = false;
            }, Math.min(30000, stageDuration * 0.35));
          }
        }

        function finish(timedOut) {
          if (finished) return;
          let revisedText = "";
          let reason = "";
          let selected = [];
          if (stage === 1) {
            const input = document.getElementById("creative-initial");
            initialText = input ? input.value.trim() : "";
            independentElapsed = performance.now() - stageStart;
          } else {
            revisedText = document.getElementById("creative-revised").value.trim();
            reason = document.getElementById("creative-reason").value.trim();
            selected = Array.from(document.querySelectorAll('input[name="creative-suggestion"]:checked'))
              .map(input => Number(input.value));
            revisionElapsed = performance.now() - stageStart;
            if (!timedOut && (revisedText.length < 10 || reason.length < 5)) {
              document.getElementById("creative-error").textContent = "请写出至少 10 个字的修订方案，并用至少 5 个字说明理由。";
              return;
            }
          }
          finished = true;
          if (interval) clearInterval(interval);
          const selectedQualities = selected.map(index => suggestions[index]?.quality).filter(Boolean);
          jsPsych.finishTrial({
            stageReached: stage,
            initialText,
            initialLength: initialText.length,
            revisedText,
            revisedLength: revisedText.length,
            revisionLengthChange: revisedText ? revisedText.length - initialText.length : null,
            selectedSuggestionIndicesJson: JSON.stringify(selected),
            selectedSuggestionQualitiesJson: JSON.stringify(selectedQualities),
            selectedSuggestionCount: selected.length,
            selectedUsefulSuggestionCount: selectedQualities.filter(quality => quality === "useful").length,
            selectedConditionalSuggestionCount: selectedQualities.filter(quality => quality === "conditional").length,
            selectedMisalignedSuggestionCount: selectedQualities.filter(quality => quality === "misaligned").length,
            revisionReason: reason,
            reasonLength: reason.length,
            independentElapsedMs: round(independentElapsed, 1),
            revisionElapsedMs: round(revisionElapsed, 1),
            totalElapsedMs: round(performance.now() - wholeStart, 1),
            manualStageAdvance,
            timedOut
          });
        }

        function updateTimer() {
          const timer = document.getElementById("creative-timer");
          if (!timer) return;
          const remaining = deadline - performance.now();
          timer.textContent = formatTime(remaining);
          timer.classList.toggle("urgent", remaining <= 15000);
          if (remaining <= 0) {
            if (stage === 1) advanceToStage2(false);
            else finish(true);
          }
        }

        renderStage1();
        updateTimer();
        interval = setInterval(updateTimer, 180);
      }
    };
  }

  function writeAICreativeSummary() {
    const rows = jsPsych.data.get().filterCustom(row =>
      row.taskName === "AI_CREATIVE" && row.phase === "formal"
    ).values();
    const selectedUseful = rows.reduce((sum, row) => sum + (Number(row.selectedUsefulSuggestionCount) || 0), 0);
    const selectedConditional = rows.reduce((sum, row) => sum + (Number(row.selectedConditionalSuggestionCount) || 0), 0);
    const selectedMisaligned = rows.reduce((sum, row) => sum + (Number(row.selectedMisalignedSuggestionCount) || 0), 0);
    const totalSelected = selectedUseful + selectedConditional + selectedMisaligned;
    const availableUseful = rows.reduce((sum, row) => {
      try {
        return sum + JSON.parse(row.aiSuggestionQualitiesJson || "[]").filter(quality => quality === "useful").length;
      } catch (error) {
        return sum;
      }
    }, 0);
    const availableConditional = rows.reduce((sum, row) => {
      try {
        return sum + JSON.parse(row.aiSuggestionQualitiesJson || "[]").filter(quality => quality === "conditional").length;
      } catch (error) {
        return sum;
      }
    }, 0);
    const availableMisaligned = rows.reduce((sum, row) => {
      try {
        return sum + JSON.parse(row.aiSuggestionQualitiesJson || "[]").filter(quality => quality === "misaligned").length;
      } catch (error) {
        return sum;
      }
    }, 0);
    writeSummary("AI_CREATIVE", {
      formalItemCount: rows.length,
      initialResponseCompletionRate: rows.length ? round(rows.filter(row => Number(row.initialLength) >= 10).length / rows.length) : null,
      revisedResponseCompletionRate: rows.length ? round(rows.filter(row => Number(row.revisedLength) >= 10).length / rows.length) : null,
      reasonCompletionRate: rows.length ? round(rows.filter(row => Number(row.reasonLength) >= 5).length / rows.length) : null,
      meanInitialLength: round(mean(rows.map(row => row.initialLength))),
      meanRevisedLength: round(mean(rows.map(row => row.revisedLength))),
      meanRevisionLengthChange: round(mean(rows.map(row => row.revisionLengthChange))),
      meanIndependentElapsedMs: round(mean(rows.map(row => row.independentElapsedMs)), 1),
      meanRevisionElapsedMs: round(mean(rows.map(row => row.revisionElapsedMs)), 1),
      meanReasonLength: round(mean(rows.map(row => row.reasonLength))),
      meanSelectedSuggestionCount: round(mean(rows.map(row => row.selectedSuggestionCount))),
      usefulShareAmongSelected: totalSelected ? round(selectedUseful / totalSelected) : null,
      usefulOrConditionalShareAmongSelected: totalSelected
        ? round((selectedUseful + selectedConditional) / totalSelected)
        : null,
      strongUsefulSuggestionSelectionRate: availableUseful ? round(selectedUseful / availableUseful) : null,
      conditionalSuggestionSelectionRate: availableConditional
        ? round(selectedConditional / availableConditional)
        : null,
      misalignedSuggestionRejectionRate: availableMisaligned
        ? round((availableMisaligned - selectedMisaligned) / availableMisaligned)
        : null,
      conditionalSuggestionScoringStatus: "有条件建议不自动判为应采纳或应拒绝，需结合修订方式与理由评分",
      scoringStatus: "初稿与修订稿待双评分；计算修订增益、原创性保留、条件权衡、有效采纳和理由质量"
    });
  }

  function buildJOLFormalTrials(group) {
    const pairCount = Math.min(
      CONFIG.jolItemsPerCondition,
      JOL_NO_AI_ITEMS.length,
      JOL_AI_ITEMS.length
    );
    const selectedPairIndices = shuffle(
      Array.from({ length: JOL_NO_AI_ITEMS.length }, (_, index) => index)
    ).slice(0, pairCount);
    const sequence = [];

    selectedPairIndices.forEach(index => {
      const matchedPairId = "JOL_PAIR_" + (index + 1);
      if (group === "A") {
        sequence.push(makeJOLItem(JOL_NO_AI_ITEMS[index], "no_ai", matchedPairId, "N"));
        sequence.push(makeJOLItem(JOL_AI_ITEMS[index], "ai", matchedPairId, "A"));
      } else {
        sequence.push(makeJOLItem(JOL_NO_AI_ITEMS[index], "ai", matchedPairId, "N"));
        sequence.push(makeJOLItem(JOL_AI_ITEMS[index], "no_ai", matchedPairId, "A"));
      }
    });

    return sequence.map((item, index) => {
      const desiredCorrectPosition = index % item.options.length;
      const balancedItem = rotateChoiceItem(item, desiredCorrectPosition - item.correctIndex);
      return jolTrial(balancedItem, "formal");
    });
  }

  function jolTrial(item, phase) {
    const duration = phase === "practice" ? Math.min(25000, CONFIG.jolItemMs) : CONFIG.jolItemMs;
    const aiBox = item.condition === "ai"
      ? `
        <div class="ai-box">
          <div class="strong">预先生成的 AI 建议（可能正确，也可能错误）：</div>
          <p>${escapeHTML(item.aiText)}</p>
        </div>
      `
      : '<div class="info-box"><strong>本题无 AI 建议，请独立判断。</strong></div>';
    return {
      type: jsPsychHtmlKeyboardResponse,
      choices: "NO_KEYS",
      stimulus: `
        <section class="gait-card">
          <div class="trial-head">
            <div><div class="module-pill">${item.condition === "ai" ? "有 AI 条件" : "无 AI 条件"}</div><h2 style="margin:0;">作答与信心判断</h2></div>
            <span id="jol-timer" class="timer"></span>
          </div>
          <div class="material-box"><strong>问题：</strong>${escapeHTML(item.question)}</div>
          ${aiBox}
          ${optionRows("jol-choice", item.options)}
          <div class="confidence-wrap">
            <label class="field-label">你认为自己的答案正确的可能性是：<strong id="jol-confidence-value">50</strong>%</label>
            <input id="jol-confidence" type="range" min="0" max="100" step="5" value="50">
            <div class="range-labels"><span>0 一定错误</span><span>50 不确定</span><span>100 一定正确</span></div>
          </div>
          <div id="jol-error" class="error-text"></div>
          <button id="jol-submit" class="gait-btn" type="button">提交</button>
        </section>
      `,
      data: baseData("JOL", phase, {
        itemId: item.id,
        matchedPairId: item.matchedPairId || null,
        itemForm: item.itemForm || null,
        condition: item.condition,
        questionText: item.question,
        optionsJson: JSON.stringify(item.options),
        optionOrderOriginalIndicesJson: JSON.stringify(item.optionOrderOriginalIndices || [0, 1, 2, 3]),
        correctIndex: item.correctIndex,
        aiSuggestionText: item.aiText,
        aiChoiceIndex: item.aiChoiceIndex,
        aiSuggestionCorrect: item.condition === "ai" ? item.aiChoiceIndex === item.correctIndex : null,
        timeLimitMs: duration
      }),
      on_load: function() {
        const started = performance.now();
        const deadline = started + duration;
        const confidence = document.getElementById("jol-confidence");
        const timer = document.getElementById("jol-timer");
        let finished = false;
        let interval = null;
        confidence.addEventListener("input", () => { document.getElementById("jol-confidence-value").textContent = confidence.value; });

        function finish(timedOut) {
          if (finished) return;
          const selected = document.querySelector('input[name="jol-choice"]:checked');
          if (!timedOut && !selected) {
            document.getElementById("jol-error").textContent = "请先选择一个答案。";
            return;
          }
          finished = true;
          if (interval) clearInterval(interval);
          const responseIndex = selected ? Number(selected.value) : null;
          jsPsych.finishTrial({
            responseIndex,
            responseLabel: responseIndex === null ? null : item.options[responseIndex],
            correct: responseIndex === null ? null : responseIndex === item.correctIndex,
            confidence: Number(confidence.value),
            absoluteCalibrationError: responseIndex === null
              ? null
              : round(Math.abs(Number(confidence.value) / 100 - (responseIndex === item.correctIndex ? 1 : 0))),
            followedAISuggestion: item.condition === "ai" && responseIndex !== null
              ? responseIndex === item.aiChoiceIndex : null,
            rt: round(performance.now() - started, 1),
            timedOut
          });
        }

        document.getElementById("jol-submit").addEventListener("click", () => finish(false));
        const update = function() {
          const remaining = deadline - performance.now();
          timer.textContent = formatTime(remaining);
          timer.classList.toggle("urgent", remaining <= 7000);
          if (remaining <= 0) finish(true);
        };
        update();
        interval = setInterval(update, 150);
      }
    };
  }

  function gammaCorrelation(rows) {
    const valid = rows.filter(row => Number.isFinite(row.confidence) && typeof row.correct === "boolean");
    let concordant = 0;
    let discordant = 0;
    for (let i = 0; i < valid.length; i++) {
      for (let j = i + 1; j < valid.length; j++) {
        const confidenceDifference = valid[i].confidence - valid[j].confidence;
        const correctnessDifference = Number(valid[i].correct) - Number(valid[j].correct);
        const product = confidenceDifference * correctnessDifference;
        if (product > 0) concordant += 1;
        else if (product < 0) discordant += 1;
      }
    }
    return concordant + discordant > 0 ? (concordant - discordant) / (concordant + discordant) : null;
  }

  function jolConditionMetrics(rows) {
    const completed = rows.filter(row => typeof row.correct === "boolean");
    return {
      trials: rows.length,
      completed: completed.length,
      completionRate: rows.length ? round(completed.length / rows.length) : null,
      accuracy: completed.length ? round(completed.filter(row => row.correct).length / completed.length) : null,
      meanConfidence: round(mean(completed.map(row => row.confidence)), 1),
      meanRT: round(mean(completed.map(row => row.rt)), 1),
      meanAbsoluteCalibrationError: round(mean(completed.map(row => row.absoluteCalibrationError))),
      gamma: round(gammaCorrelation(completed))
    };
  }

  function writeJOLSummary() {
    const rows = jsPsych.data.get().filterCustom(row => row.taskName === "JOL" && row.phase === "formal").values();
    const noAI = jolConditionMetrics(rows.filter(row => row.condition === "no_ai"));
    const ai = jolConditionMetrics(rows.filter(row => row.condition === "ai"));
    writeSummary("JOL", {
      formalItemCount: rows.length,
      counterbalanceGroup: state.orderGroup,
      matchedCrossoverDesign: true,
      noAIJson: JSON.stringify(noAI),
      aiJson: JSON.stringify(ai),
      gammaNoAI: noAI.gamma,
      gammaAI: ai.gamma,
      deltaGamma: Number.isFinite(ai.gamma) && Number.isFinite(noAI.gamma) ? round(ai.gamma - noAI.gamma) : null,
      confidenceInflationAIminusNoAI: Number.isFinite(ai.meanConfidence) && Number.isFinite(noAI.meanConfidence)
        ? round(ai.meanConfidence - noAI.meanConfidence, 1) : null,
      accuracyChangeAIminusNoAI: Number.isFinite(ai.accuracy) && Number.isFinite(noAI.accuracy)
        ? round(ai.accuracy - noAI.accuracy) : null,
      responseTimeChangeAIminusNoAI: Number.isFinite(ai.meanRT) && Number.isFinite(noAI.meanRT)
        ? round(ai.meanRT - noAI.meanRT, 1) : null,
      calibrationErrorChangeAIminusNoAI:
        Number.isFinite(ai.meanAbsoluteCalibrationError) && Number.isFinite(noAI.meanAbsoluteCalibrationError)
          ? round(ai.meanAbsoluteCalibrationError - noAI.meanAbsoluteCalibrationError) : null,
      gammaInterpretationStatus: "探索性指标：每个条件仅6题，个体层面的Gamma需结合更多题目和预测试稳定性解释"
    });
  }

  function jolModule(moduleNumber) {
    const timeline = [
      moduleIntro(
        moduleNumber,
        "元认知信心校准",
        "比较有无 AI 建议时，信心判断与实际正确性是否一致。",
        `<div class="rule-grid">
          <div class="rule-item"><h3>先完成选择题</h3><p>阅读问题和四个选项，选择你认为最正确的答案。</p></div>
          <div class="rule-item"><h3>再评价信心</h3><p>拖动滑块，回答“我这次答案正确的可能性是多少”。0% 表示几乎肯定错，100% 表示几乎肯定对。</p></div>
          <div class="rule-item"><h3>有 AI 与无 AI</h3><p>部分题目会显示固定 AI 建议，部分题目没有。AI 建议可能正确，也可能错误。</p></div>
          <div class="rule-item"><h3>如实评分</h3><p>信心没有“越高越好”。不确定时可以选 40%-60%；很有把握时再选择较高或较低数值。</p></div>
        </div>
        <div class="example-box"><strong>例子：</strong>如果你觉得答案大约有七成可能正确，就把信心调到 70%。</div>`
      )
    ];
    JOL_PRACTICE_ITEMS.forEach(item => {
      timeline.push(jolTrial(item, "practice"));
      timeline.push(practiceFeedback("JOL", row => `
        <div class="${row.correct ? "success-text" : "error-text"}">${row.correct ? "答案正确" : "答案不正确"}</div>
        <p>正确答案：<strong>${escapeHTML(item.options[item.correctIndex])}</strong></p>
        ${item.condition === "ai"
          ? `<p>本练习题中的 AI 建议是<strong>${item.aiChoiceIndex === item.correctIndex ? "正确的" : "错误的"}</strong>，请记住正式题中的 AI 也不一定可靠。</p>`
          : ""}
        <p>练习时请同时熟悉 0%-100% 的信心评分。</p>
      `, 1200));
    });
    timeline.push(simpleMessage(
      "正式任务",
      "<p>正式题不再反馈对错。AI 建议有时可靠、有时不可靠，请保持自己的判断。</p>",
      "开始正式任务"
    ));

    timeline.push({
      timeline: buildJOLFormalTrials("A"),
      conditional_function: () => state.orderGroup === "A"
    });
    timeline.push({
      timeline: buildJOLFormalTrials("B"),
      conditional_function: () => state.orderGroup === "B"
    });
    timeline.push(moduleComplete("元认知信心校准", writeJOLSummary));
    return timeline;
  }

  function writeSessionSummary() {
    if (state.summaryWritten) return;
    state.summaryWritten = true;
    const rows = jsPsych.data.get().values();
    const requiredTasks = ["AUT", "RAT", "PROBLEM_FINDING", "STOP_SIGNAL", "NBACK", "TASK_SWITCH", "AI_ADVICE", "AI_CREATIVE", "JOL"];
    const completedTasks = requiredTasks.filter(task =>
      rows.some(row => row.taskName === task && row.phase === "formal")
    );
    const fatigueRows = rows.filter(row => row.taskName === "FATIGUE" && row.phase === "formal");
    const firstFatigue = fatigueRows.length ? fatigueRows[0].fatigueRating : null;
    const lastFatigue = fatigueRows.length ? fatigueRows[fatigueRows.length - 1].fatigueRating : null;
    const qualityFlags = [];
    if (completedTasks.length < requiredTasks.length) qualityFlags.push("missing_core_module");
    if (state.visibilityHiddenCount > 0) qualityFlags.push("page_hidden_during_test");
    if (Number(lastFatigue) >= 8) qualityFlags.push("high_final_fatigue");

    const stopSummary = rows.find(row => row.taskName === "STOP_SIGNAL_SUMMARY");
    if (stopSummary && Number(stopSummary.goOmissionRate) > 0.20) qualityFlags.push("high_go_omission");
    if (stopSummary && stopSummary.ssrtValid === false) qualityFlags.push("invalid_ssrt");

    const nbackSummary = rows.find(row => row.taskName === "NBACK_SUMMARY");
    if (nbackSummary && (
      Number(nbackSummary.oneBackOmissionRate) > 0.10 ||
      Number(nbackSummary.twoBackOmissionRate) > 0.10
    )) qualityFlags.push("high_nback_omission");

    writeSummary("GAIT", {
      completedTaskCount: completedTasks.length,
      expectedTaskCount: requiredTasks.length,
      completionRate: round(completedTasks.length / requiredTasks.length),
      completedTasksJson: JSON.stringify(completedTasks),
      missingTasksJson: JSON.stringify(requiredTasks.filter(task => !completedTasks.includes(task))),
      visibilityHiddenCount: state.visibilityHiddenCount,
      visibilityLogJson: JSON.stringify(state.visibilityLog),
      initialFatigue: firstFatigue,
      finalFatigue: lastFatigue,
      fatigueChange: Number.isFinite(Number(firstFatigue)) && Number.isFinite(Number(lastFatigue))
        ? Number(lastFatigue) - Number(firstFatigue) : null,
      sessionDurationMinutes: round((performance.now() - state.startedPerformance) / 60000, 2),
      qualityFlagsJson: JSON.stringify(qualityFlags),
      compositeScoreStatus: "未计算：开放题需双评分，且须经预测试标准化、信效度检验和年龄常模后才能合成"
    });
  }

  function closingTrial() {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <section class="gait-card compact center">
          <div class="status-pill">全部任务已完成</div>
          <h2 style="margin-top:16px;">感谢你的认真参与</h2>
          <p>AI 建议并不总是正确，重要的是核查证据、保留判断，并在有帮助时选择性使用。</p>
          <div class="warning-box">
            本程序不会当场给出“拔尖/不拔尖”结论。开放题需双评分，综合指数需在预测试、信效度检验和同年龄常模建立后才能解释。
          </div>
          <p class="muted small">点击下方按钮结束实验，随后由主试下载正式数据 CSV。</p>
        </section>
      `,
      choices: ["结束并进入数据下载页"],
      on_start: function(trial) {
        state.pendingSummary = null;
        writeSessionSummary();
        if (state.pendingSummary) trial.data = { ...trial.data, ...state.pendingSummary };
      },
      data: baseData("CLOSING", "instruction", { includeInPrimary: false })
    };
  }

  function safeFilenamePart(value) {
    return String(value || "unknown").replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 30);
  }

  function downloadBlob(content, mimeType, filename) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function renderDownloadPage() {
    persistCheckpoint();
    state.finished = true;
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
    const root = document.getElementById("jspsych-target");
    const backupMessage = state.checkpointAvailable
      ? "若误刷新，同一标签页可在启动页导出备份 JSON，但实验不能从中断处接续。"
      : "当前浏览器未能建立标签页备份，请勿刷新或关闭页面。";
    root.innerHTML = `
      <section class="gait-card">
        <div class="status-pill">数据已保留在本页面内存中</div>
        <h2 style="margin-top:16px;">请由主试下载并核对文件</h2>
        <p>被试编号：<strong>${escapeHTML(state.participantId)}</strong>　·　顺序组：<strong>${escapeHTML(state.orderGroup)}</strong>　·　运行模式：<strong>${escapeHTML(CONFIG.runMode)}</strong></p>
        <div class="warning-box">
          请在关闭标签页前至少下载“正式数据 CSV”，并确认文件已保存。${backupMessage}
        </div>
        <div class="download-grid">
          <div class="download-card">
            <h3>正式数据 CSV</h3>
            <p class="muted small">包含基本信息、正式试次、疲劳记录、模块汇总和会话汇总；不含练习与指导语。</p>
            <button id="download-csv" class="gait-btn" type="button">下载正式数据 CSV</button>
          </div>
          <div class="download-card">
            <h3>完整过程 JSON</h3>
            <p class="muted small">含练习、正式任务和系统事件，适合程序排错与过程复核；不用于直接计分。</p>
            <button id="download-json" class="gait-btn secondary" type="button">下载完整 JSON</button>
          </div>
        </div>
        <div id="download-status" class="success-text" style="margin-top:18px;"></div>
        <p class="muted small">数据仅包含匿名编号和计划书规定的最小化字段。请按伦理审批方案加密保存并限制访问。</p>
      </section>
    `;

    const date = new Date().toISOString().slice(0, 10).replaceAll("-", "");
    const base = "GAIT-Junior_" + safeFilenamePart(state.participantId) + "_" + CONFIG.runMode + "_" + date;
    const status = document.getElementById("download-status");
    document.getElementById("download-csv").addEventListener("click", function() {
      const formal = jsPsych.data.get().filterCustom(row => row.includeInPrimary === true);
      downloadBlob("\ufeff" + formal.csv(), "text/csv;charset=utf-8", base + ".csv");
      clearCheckpoint();
      status.textContent = "正式数据 CSV 已触发下载，请检查浏览器下载文件夹。";
    });
    document.getElementById("download-json").addEventListener("click", function() {
      downloadBlob(JSON.stringify(jsPsych.data.get().values(), null, 2), "application/json;charset=utf-8", base + "_完整过程.json");
      clearCheckpoint();
      status.textContent = "完整过程 JSON 已触发下载，请检查浏览器下载文件夹。";
    });
  }

  const timeline = [
    consentTrial(),
    deviceGateTrial(),
    demographicsTrial(),
    readinessTrial(),
    experimentOverviewTrial(),
    fatigueTrial("baseline", false)
  ];

  timeline.push(
    ...autModule(1),
    ...ratModule(2),
    ...problemFindingModule(3),
    fatigueTrial("break_1_after_module_3", true),
    ...stopSignalModule(4),
    ...nBackModule(5),
    ...taskSwitchModule(6),
    fatigueTrial("break_2_after_module_6", true),
    ...aiAdviceModule(7),
    ...aiCreativeModule(8),
    ...jolModule(9),
    fatigueTrial("post_test", false),
    closingTrial()
  );

  jsPsych.run(timeline);

  </script>
