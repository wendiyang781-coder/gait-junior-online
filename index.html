<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAIT-Junior 初中标准筛查版</title>

  <!-- jsPsych 7.3.4 及所需插件。首次运行需要联网加载这些 CDN 文件。 -->
  <script src="https://unpkg.com/jspsych@7.3.4/dist/index.browser.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3/dist/index.browser.js"></script>

  <style>
    :root {
      --ink: #14213d;
      --muted: #5f6b7a;
      --blue: #1f5fbf;
      --blue-dark: #17478f;
      --blue-pale: #eef5ff;
      --cyan: #0e8a92;
      --green: #18864b;
      --red: #c43b3b;
      --orange: #ef8c2f;
      --line: #d7dfeb;
      --paper: #ffffff;
      --bg: #f3f6fb;
      --shadow: 0 18px 50px rgba(31, 61, 107, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(64, 147, 255, 0.12), transparent 32rem),
        radial-gradient(circle at 100% 100%, rgba(14, 138, 146, 0.10), transparent 30rem),
        var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    body { font-size: 17px; line-height: 1.65; }

    #jspsych-target {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    #jspsych-content {
      width: min(960px, 100%);
      max-width: 960px;
    }

    .gait-card {
      width: 100%;
      padding: clamp(24px, 4vw, 44px);
      border: 1px solid rgba(215, 223, 235, 0.95);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: var(--shadow);
      text-align: left;
    }

    .gait-card.compact { max-width: 760px; margin: 0 auto; }
    .gait-card.center { text-align: center; }

    h1, h2, h3 { line-height: 1.3; margin-top: 0; color: var(--ink); }
    h1 { font-size: clamp(28px, 4.2vw, 42px); margin-bottom: 12px; }
    h2 { font-size: clamp(24px, 3.4vw, 32px); margin-bottom: 16px; }
    h3 { font-size: 20px; margin-bottom: 10px; }
    p { margin: 10px 0; }

    .subtitle { color: var(--muted); font-size: 18px; margin-bottom: 24px; }

    .module-pill, .mode-pill, .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 13px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .module-pill { color: var(--blue); background: var(--blue-pale); margin-bottom: 14px; }
    .mode-pill { color: #7b4c00; background: #fff2cf; }
    .status-pill { color: var(--green); background: #e8f7ef; }

    .info-box, .warning-box, .ai-box, .material-box {
      margin: 18px 0;
      padding: 16px 18px;
      border-radius: 14px;
      text-align: left;
    }

    .info-box { border-left: 5px solid var(--blue); background: var(--blue-pale); }
    .warning-box { border-left: 5px solid #d08a00; background: #fff7df; }
    .ai-box { border: 1px solid #9cc6d9; background: #edf9fb; }
    .material-box { border: 1px solid var(--line); background: #f9fbfe; }

    .instruction-panel {
      margin: 22px 0 16px;
      padding: 22px;
      border: 1px solid #bcd0ed;
      border-radius: 16px;
      background: #f6faff;
    }

    .instruction-panel > h3 { margin-bottom: 16px; color: var(--blue-dark); }
    .rule-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .rule-item {
      min-height: 112px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .rule-item h3 { margin: 0 0 7px; color: var(--ink); font-size: 17px; }
    .rule-item p { margin: 5px 0; }
    .example-box {
      margin-top: 12px;
      padding: 13px 15px;
      border-left: 4px solid var(--cyan);
      border-radius: 9px;
      background: #edf9fb;
    }

    .key-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      margin: 0 4px;
      padding: 2px 10px;
      border: 1px solid #9fb1ca;
      border-bottom-width: 3px;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font-weight: 850;
    }

    .module-progress {
      height: 8px;
      margin: 0 0 20px;
      overflow: hidden;
      border-radius: 999px;
      background: #e4eaf3;
    }

    .module-progress > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    .sequence-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px;
      margin: 20px 0;
    }

    .sequence-item {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: start;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .sequence-number {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue-pale);
      color: var(--blue);
      font-weight: 850;
    }

    .sequence-item strong { display: block; line-height: 1.35; }
    .sequence-item span:last-child { color: var(--muted); font-size: 13px; line-height: 1.45; }

    .muted { color: var(--muted); }
    .small { font-size: 14px; }
    .strong { font-weight: 800; }
    .no-select { user-select: none; }

    .gait-btn, .jspsych-btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(31, 95, 191, 0.22);
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
      margin: 8px 6px 0 0;
    }

    .gait-btn:hover, .jspsych-btn:hover { background: var(--blue-dark); transform: translateY(-1px); }
    .gait-btn:focus-visible, .jspsych-btn:focus-visible,
    input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(31, 95, 191, 0.28);
      outline-offset: 2px;
    }

    .gait-btn.secondary { color: var(--blue); background: #edf3fc; box-shadow: none; }
    .gait-btn.danger { background: var(--red); }
    .gait-btn:disabled { cursor: not-allowed; opacity: 0.45; transform: none; }

    .button-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
    .button-row.center { justify-content: center; }

    label.field-label { display: block; margin: 16px 0 6px; font-weight: 750; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      border: 1px solid #bfcadd;
      border-radius: 11px;
      background: #fff;
      padding: 11px 13px;
      color: var(--ink);
      font: inherit;
    }

    textarea { min-height: 112px; resize: vertical; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 18px;
    }

    .check-row, .choice-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 11px 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .choice-row { cursor: pointer; }
    .choice-row:hover { border-color: #91acd6; background: #f7faff; }
    input[type="checkbox"], input[type="radio"] { width: 19px; height: 19px; margin-top: 4px; flex: 0 0 auto; }

    .timer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 86px;
      border-radius: 999px;
      padding: 6px 12px;
      background: #eef2f8;
      color: #33445f;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .timer.urgent { background: #ffe9e9; color: #a52b2b; }

    .trial-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: start;
      gap: 10px;
      margin: 10px 0;
    }

    .entry-number {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--blue);
      background: var(--blue-pale);
      font-weight: 800;
    }

    .rat-cues {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    .rat-cue {
      display: grid;
      place-items: center;
      min-height: 88px;
      border: 2px solid #bdd0ea;
      border-radius: 16px;
      background: #f7fbff;
      font-size: 34px;
      font-weight: 850;
    }

    .rt-shell { text-align: center; }
    .rt-map { color: var(--muted); margin-bottom: 22px; font-weight: 700; }
    .fixation { font-size: 56px; font-weight: 400; line-height: 1; }
    .arrow-stimulus { font-size: 96px; line-height: 1.15; font-weight: 900; }
    .stop-cue {
      height: 48px;
      color: transparent;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.15em;
    }
    .stop-cue.active { color: var(--red); }
    .stop-ai-distractor {
      min-height: 36px;
      margin: 0 auto 8px;
      padding: 5px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: transparent;
      font-size: 14px;
      font-weight: 750;
    }
    .stop-ai-distractor.active {
      border-color: #9cc6d9;
      background: #edf9fb;
      color: #176675;
    }

    .nback-stimulus {
      min-height: 180px;
      display: grid;
      place-items: center;
      font-size: 96px;
      font-weight: 850;
    }

    .switch-cue { min-height: 42px; color: var(--blue); font-size: 25px; font-weight: 850; }
    .switch-shape-wrap { min-height: 170px; display: grid; place-items: center; }
    .shape-circle { width: 96px; height: 96px; border-radius: 50%; }
    .shape-triangle { width: 0; height: 0; border-left: 56px solid transparent; border-right: 56px solid transparent; }
    .shape-triangle.orange { border-bottom: 98px solid var(--orange); }
    .shape-triangle.blue { border-bottom: 98px solid #2676d9; }
    .shape-circle.orange { background: var(--orange); }
    .shape-circle.blue { background: #2676d9; }

    .confidence-wrap { margin: 18px 0; }
    input[type="range"] { width: 100%; accent-color: var(--blue); }
    .range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }

    .error-text { min-height: 26px; color: var(--red); font-weight: 700; margin-top: 8px; }
    .success-text { color: var(--green); font-weight: 800; }

    .download-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .download-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      background: #fbfcff;
    }

    @media (max-width: 680px) {
      body { font-size: 16px; }
      #jspsych-target { padding: 12px 8px; }
      .gait-card { border-radius: 15px; padding: 22px 17px; }
      .form-grid, .download-grid, .rule-grid, .sequence-grid { grid-template-columns: 1fr; }
      .rat-cue { font-size: 28px; min-height: 70px; }
      .arrow-stimulus, .nback-stimulus { font-size: 76px; }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="max-width:720px;margin:40px auto;padding:24px;background:#fff;border:1px solid #ddd;">
      本实验需要启用 JavaScript。请在浏览器设置中启用后重新打开。
    </div>
  </noscript>
  <div id="jspsych-target"></div>

  <script>
  "use strict";

  if (
    typeof initJsPsych !== "function" ||
    typeof jsPsychHtmlKeyboardResponse === "undefined" ||
    typeof jsPsychHtmlButtonResponse === "undefined"
  ) {
    document.getElementById("jspsych-target").innerHTML = `
      <section class="gait-card compact">
        <h2>实验组件加载失败</h2>
        <div class="warning-box">
          请确认电脑已联网，并允许访问 unpkg.com，然后刷新页面。若学校网络屏蔽 CDN，请使用离线部署版。
        </div>
      </section>
    `;
    throw new Error("jsPsych 或必要插件未成功加载");
  }

  /* ================================================================
     GAIT-Junior 初中标准筛查版 v1.5.0-pilot
     - 默认：完整预测试版本（预计 40-50 分钟）
     - 快速演示：在文件网址末尾添加 ?demo=1
     - 所有 AI 内容均为固定材料，不调用实时 AI
     ================================================================ */

  const EXPERIMENT = Object.freeze({
    name: "GAIT-Junior 初中标准筛查版",
    version: "1.5.0-pilot",
    ageVersion: "middle_school_grade_7_9",
    taskCount: 9
  });

  const query = new URLSearchParams(window.location.search);
  const DEMO_MODE = query.get("demo") === "1";

  /* 正式施测前，可只在这里调整时长和试次数。毫秒 = 秒数 x 1000。 */
  const CONFIG = Object.freeze({
    runMode: DEMO_MODE ? "demo" : "formal",
    autPracticeMs: DEMO_MODE ? 10000 : 45000,
    autFormalMs: DEMO_MODE ? 12000 : 150000,
    problemPracticeMs: DEMO_MODE ? 10000 : 45000,
    problemFormalMs: DEMO_MODE ? 12000 : 120000,
    ratFormalItems: DEMO_MODE ? 3 : 12,
    ratItemMs: DEMO_MODE ? 7000 : 20000,
    stopPracticeTrials: DEMO_MODE ? 4 : 12,
    stopBlocks: DEMO_MODE ? 1 : 3,
    stopTrialsPerBlock: DEMO_MODE ? 8 : 40,
    nbackPracticeTrials: DEMO_MODE ? 6 : 14,
    nbackTwoBackPracticeTrials: DEMO_MODE ? 6 : 14,
    nbackTrialsPerLevel: DEMO_MODE ? 10 : 48,
    switchPureTrials: DEMO_MODE ? 6 : 16,
    switchMixedTrials: DEMO_MODE ? 12 : 64,
    aiAdviceItems: DEMO_MODE ? 2 : 8,
    aiAdviceIndependentMs: DEMO_MODE ? 10000 : 35000,
    aiAdviceReviewMs: DEMO_MODE ? 15000 : 50000,
    creativePracticeStageMs: DEMO_MODE ? 7000 : 30000,
    creativeFormalStageMs: DEMO_MODE ? 10000 : 90000,
    jolItemsPerCondition: DEMO_MODE ? 2 : 6,
    jolItemMs: DEMO_MODE ? 12000 : 35000,
    breakMinMs: DEMO_MODE ? 2000 : 60000
  });

  const state = {
    sessionId: makeId("S"),
    participantId: "",
    orderGroup: "",
    startedAt: new Date().toISOString(),
    startedPerformance: performance.now(),
    started: false,
    finished: false,
    visibilityHiddenCount: 0,
    visibilityLog: [],
    currentModule: "",
    stopSSD: 250,
    pendingSummary: null,
    summaryWritten: false,
    checkpointAvailable: false
  };

  function makeId(prefix) {
    const bytes = new Uint8Array(8);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(bytes);
    } else {
      for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    return prefix + "-" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
  }

  function hashString(value) {
    let hash = 2166136261;
    for (let i = 0; i < value.length; i++) {
      hash ^= value.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function shuffle(items) {
    const result = items.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function mean(values) {
    const valid = values.filter(Number.isFinite);
    return valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
  }

  function median(values) {
    const valid = values.filter(Number.isFinite).sort((a, b) => a - b);
    if (!valid.length) return null;
    const mid = Math.floor(valid.length / 2);
    return valid.length % 2 ? valid[mid] : (valid[mid - 1] + valid[mid]) / 2;
  }

  function quantile(values, probability) {
    const valid = values.filter(Number.isFinite).sort((a, b) => a - b);
    if (!valid.length) return null;
    const p = Math.min(1, Math.max(0, probability));
    const index = (valid.length - 1) * p;
    const lower = Math.floor(index);
    const upper = Math.ceil(index);
    if (lower === upper) return valid[lower];
    return valid[lower] + (valid[upper] - valid[lower]) * (index - lower);
  }

  function round(value, digits = 3) {
    return Number.isFinite(value) ? Number(value.toFixed(digits)) : null;
  }

  function formatTime(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = String(totalSeconds % 60).padStart(2, "0");
    return minutes + ":" + seconds;
  }

  function normalizeShortAnswer(value) {
    return String(value ?? "").trim().replace(/\s+/g, "").toLowerCase();
  }

  function baseData(taskName, phase, extra = {}) {
    return {
      taskName,
      phase,
      includeInPrimary: phase === "formal",
      ...extra
    };
  }

  const CHECKPOINT_KEY = "GAIT_JUNIOR_CHECKPOINT_V1";

  function readCheckpoint() {
    try {
      const raw = window.sessionStorage.getItem(CHECKPOINT_KEY);
      if (!raw) return null;
      const checkpoint = JSON.parse(raw);
      return checkpoint && Array.isArray(checkpoint.rows) ? checkpoint : null;
    } catch (error) {
      return null;
    }
  }

  function persistCheckpoint() {
    if (!state.started || state.finished) return;
    try {
      window.sessionStorage.setItem(CHECKPOINT_KEY, JSON.stringify({
        experimentName: EXPERIMENT.name,
        experimentVersion: EXPERIMENT.version,
        participantId: state.participantId || null,
        sessionId: state.sessionId,
        savedAt: new Date().toISOString(),
        rows: jsPsych.data.get().values()
      }));
      state.checkpointAvailable = true;
    } catch (error) {
      state.checkpointAvailable = false;
    }
  }

  function clearCheckpoint() {
    try {
      window.sessionStorage.removeItem(CHECKPOINT_KEY);
    } catch (error) {
      // 某些 file:// 环境会禁用 sessionStorage；不影响实验继续运行。
    }
    state.checkpointAvailable = false;
  }

  const jsPsych = initJsPsych({
    display_element: "jspsych-target",
    show_progress_bar: false,
    on_trial_start: function(trial) {
      trial.data = trial.data || {};
      trial.data.trialStartedAt = new Date().toISOString();
      trial.data.moduleAtStart = state.currentModule || null;
    },
    on_trial_finish: function(data) {
      data.trialEndedAt = new Date().toISOString();
      data.visibilityHiddenCountSoFar = state.visibilityHiddenCount;
      if (
        data.taskName === "DEMOGRAPHICS" ||
        data.taskName === "FATIGUE" ||
        String(data.taskName || "").endsWith("_SUMMARY")
      ) {
        window.setTimeout(persistCheckpoint, 0);
      }
    },
    on_finish: renderDownloadPage
  });

  jsPsych.data.addProperties({
    experimentName: EXPERIMENT.name,
    experimentVersion: EXPERIMENT.version,
    ageVersion: EXPERIMENT.ageVersion,
    runMode: CONFIG.runMode,
    sessionId: state.sessionId,
    sessionStartedAt: state.startedAt
  });

  document.addEventListener("visibilitychange", function() {
    if (!state.started || document.visibilityState !== "hidden") return;
    state.visibilityHiddenCount += 1;
    const event = {
      event: "visibility_hidden",
      at: new Date().toISOString(),
      performanceMs: round(performance.now() - state.startedPerformance, 1),
      module: state.currentModule || null
    };
    state.visibilityLog.push(event);
  });

  window.addEventListener("beforeunload", function(event) {
    if (!state.started || state.finished) return;
    persistCheckpoint();
    event.preventDefault();
    event.returnValue = "";
  });

  function moduleIntro(moduleNumber, title, description, rules) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: function() {
        state.currentModule = title;
        return `
          <section class="gait-card">
            <div class="module-pill">模块 ${moduleNumber} / ${EXPERIMENT.taskCount}</div>
            <div class="module-progress" aria-label="当前实验进度">
              <span style="width:${round(moduleNumber / EXPERIMENT.taskCount * 100, 1)}%"></span>
            </div>
            <h2>${escapeHTML(title)}</h2>
            <p class="subtitle">${escapeHTML(description)}</p>
            <div class="instruction-panel">
              <h3>请先读懂任务要求</h3>
              ${rules}
            </div>
            <div class="info-box small">
              <strong>实验流程：</strong>先完成带反馈的练习，确认理解后再进入正式任务。练习不计入正式结果；正式任务开始后不再提示对错。
            </div>
          </section>
        `;
      },
      choices: ["我已读懂，开始练习"],
      data: baseData("INSTRUCTION", "instruction", {
        includeInPrimary: false,
        moduleNumber,
        moduleTitle: title
      })
    };
  }

  function simpleMessage(title, body, button = "继续", extraData = {}) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <section class="gait-card compact">

  function timedMultiEntryTrial(options) {
    const initialRows = options.initialRows || 4;
    const isMultiline = Boolean(options.multiline);
    const allowEarlyFinish = options.allowEarlyFinish ?? options.phase === "practice";
    return {
      type: jsPsychHtmlKeyboardResponse,
      choices: "NO_KEYS",
      stimulus: `
        <section class="gait-card">
          <div class="trial-head">
            <div>
              <div class="module-pill">${escapeHTML(options.badge || options.taskName)}</div>
              <h2 style="margin-bottom:0;">${escapeHTML(options.title)}</h2>
            </div>
            <span id="entry-timer" class="timer"></span>
          </div>
          <div class="material-box">${options.promptHTML}</div>
          <p class="muted">${escapeHTML(options.guidance)}</p>
          <div id="entry-list"></div>
          <div class="button-row">
            <button id="add-entry" class="gait-btn secondary" type="button">＋ 再添加一条</button>
            <button id="finish-entry" class="gait-btn" type="button" ${allowEarlyFinish ? "" : 'style="display:none"'}>提前结束本题</button>
          </div>
          ${allowEarlyFinish ? "" : '<p class="muted small">正式任务采用固定时长，倒计时结束后系统会自动提交。</p>'}
          <div id="entry-error" class="error-text"></div>
        </section>
      `,
      data: baseData(options.taskName, options.phase, {
        itemId: options.itemId,
        itemPrompt: options.promptText,
        timeLimitMs: options.durationMs,
        earlyFinishAllowed: allowEarlyFinish
      }),
      on_load: function() {
        const started = performance.now();
        const deadline = started + options.durationMs;
        const list = document.getElementById("entry-list");
        const timer = document.getElementById("entry-timer");
        const finishButton = document.getElementById("finish-entry");
        const addButton = document.getElementById("add-entry");
        const error = document.getElementById("entry-error");
        const rowMeta = [];
        const actionLog = [];
        let finished = false;

        function addRow(focus = false) {
          if (rowMeta.length >= 20) return;
          const index = rowMeta.length;
          const wrapper = document.createElement("div");
          wrapper.className = "entry-row";
          wrapper.innerHTML = `
            <div class="entry-number">${index + 1}</div>
            ${isMultiline
              ? '<textarea class="entry-input" rows="2" maxlength="300" placeholder="' + escapeHTML(options.placeholder) + '"></textarea>'
              : '<input class="entry-input" type="text" maxlength="180" autocomplete="off" placeholder="' + escapeHTML(options.placeholder) + '">'}
          `;
          list.appendChild(wrapper);
          const input = wrapper.querySelector(".entry-input");
          rowMeta.push({ firstInputMs: null, lastInputMs: null });
          input.addEventListener("input", function() {
            const elapsed = performance.now() - started;
            if (rowMeta[index].firstInputMs === null && input.value.trim()) rowMeta[index].firstInputMs = elapsed;
            rowMeta[index].lastInputMs = elapsed;
          });
          if (!isMultiline) {
            input.addEventListener("keydown", function(event) {
              if (event.key === "Enter" && !event.isComposing && event.keyCode !== 229) {
                event.preventDefault();
                if (index === rowMeta.length - 1) addRow(true);
              }
            });
          }
          actionLog.push({ action: "add_row", row: index + 1, atMs: round(performance.now() - started, 1) });
          if (focus) input.focus();
        }

        function collectResponses() {
          return Array.from(list.querySelectorAll(".entry-input"))
            .map((input, index) => ({
              number: index + 1,
              text: input.value.trim(),
              firstInputMs: round(rowMeta[index].firstInputMs, 1),
              lastInputMs: round(rowMeta[index].lastInputMs, 1)
            }))
            .filter(item => item.text.length > 0);
        }

        function finish(timedOut) {
          if (finished) return;
          if (!timedOut && !allowEarlyFinish) return;
          const elapsed = performance.now() - started;
          if (!timedOut && elapsed < Math.min(30000, options.durationMs * 0.35)) {
            error.textContent = "请先认真思考一会儿；如果确实完成，可等待按钮解锁。";
            return;
          }
          finished = true;
          clearInterval(interval);
          const responses = collectResponses();
          jsPsych.finishTrial({
            responsesJson: JSON.stringify(responses),
            responseCount: responses.length,
            elapsedMs: round(elapsed, 1),
            timedOut,
            earlyFinish: !timedOut && allowEarlyFinish,
            actionLogJson: JSON.stringify(actionLog)
          });
        }

        for (let i = 0; i < initialRows; i++) addRow(i === 0);
        addButton.addEventListener("click", () => addRow(true));
        if (allowEarlyFinish) {
          finishButton.disabled = true;
          setTimeout(() => { if (!finished) finishButton.disabled = false; }, Math.min(30000, options.durationMs * 0.35));
          finishButton.addEventListener("click", () => finish(false));
        }

        const updateTimer = function() {
          const remaining = deadline - performance.now();
          timer.textContent = formatTime(remaining);
          timer.classList.toggle("urgent", remaining <= 15000);
          if (remaining <= 0) finish(true);
        };
        updateTimer();
        const interval = setInterval(updateTimer, 200);
      }
    };
  }

  function ratTrial(item, phase) {
    const duration = phase === "practice" ? Math.min(15000, CONFIG.ratItemMs) : CONFIG.ratItemMs;
    return {
      type: jsPsychHtmlKeyboardResponse,
      choices: "NO_KEYS",
      stimulus: `
        <section class="gait-card compact">
          <div class="trial-head">
            <h2 style="margin:0;">找出共同联结字</h2>
            <span id="rat-timer" class="timer"></span>
          </div>
          <p>想出一个汉字，使它能分别与下面三个字组成常用词语（前后位置可以不同）。</p>
          <div class="rat-cues no-select">
            ${item.cues.map(cue => '<div class="rat-cue">' + escapeHTML(cue) + '</div>').join("")}
          </div>
          <label class="field-label" for="rat-answer">共同联结字</label>
          <input id="rat-answer" type="text" maxlength="2" autocomplete="off" inputmode="text">
          <div class="button-row">
            <button id="rat-submit" class="gait-btn" type="button">提交</button>
            <button id="rat-skip" class="gait-btn secondary" type="button">不会，跳过</button>
          </div>
        </section>
      `,
      data: baseData("RAT", phase, {
        itemId: item.id,
        cues: item.cues.join("|"),
        difficulty: item.difficulty,
        correctAnswer: item.answer,
        compounds: item.compounds.join("|"),
        timeLimitMs: duration
      }),
      on_load: function() {
        const started = performance.now();
        const deadline = started + duration;
        const input = document.getElementById("rat-answer");
        const timer = document.getElementById("rat-timer");
        let finished = false;

        function finish(timedOut, skipped) {
          if (finished) return;
          finished = true;
          clearInterval(interval);
          const response = skipped ? "" : normalizeShortAnswer(input.value);
          jsPsych.finishTrial({
            response,
            correct: response === normalizeShortAnswer(item.answer),
            skipped,
            timedOut,
            rt: round(performance.now() - started, 1)
          });
        }

        input.focus();
        input.addEventListener("keydown", function(event) {
          if (event.key === "Enter" && !event.isComposing && event.keyCode !== 229) finish(false, false);
        });
        document.getElementById("rat-submit").addEventListener("click", () => finish(false, false));
        document.getElementById("rat-skip").addEventListener("click", () => finish(false, true));

        const update = function() {
          const remaining = deadline - performance.now();
          timer.textContent = formatTime(remaining);
          timer.classList.toggle("urgent", remaining <= 5000);
          if (remaining <= 0) finish(true, false);
        };
        update();
        const interval = setInterval(update, 150);
      }
    };
  }

  function practiceFeedback(taskName, formatter, duration = 900) {
    return {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        const rows = jsPsych.data.get().filterCustom(row => row.taskName === taskName && row.phase === "practice").values();
        const row = rows[rows.length - 1] || {};
        return '<section class="gait-card compact center">' + formatter(row) + '</section>';
      },
      choices: "NO_KEYS",
      trial_duration: duration,
      data: baseData(taskName + "_FEEDBACK", "practice", { includeInPrimary: false })
    };
  }

  function balancedStopDefinitions(totalTrials, includeAIDistractor = false, balanceOffset = 0) {
    const stopCount = Math.max(2, Math.round(totalTrials * 0.25));
    const goCount = totalTrials - stopCount;

    function buildSubset(count, isStop) {
      if (!includeAIDistractor) {
        return Array.from({ length: count }, (_, index) => ({
          isStop,
          direction: index % 2 === 0 ? "left" : "right",
          aiDistractor: false
        }));
      }

      const aiCount = Math.floor(count / 2);
      const leftCount = Math.floor(count / 2);
      const aiLeftCount = balanceOffset % 2 === 0 ? Math.ceil(aiCount / 2) : Math.floor(aiCount / 2);
      const cellCounts = [
        { direction: "left", aiDistractor: true, count: aiLeftCount },
        { direction: "right", aiDistractor: true, count: aiCount - aiLeftCount },
        { direction: "left", aiDistractor: false, count: leftCount - aiLeftCount },
        { direction: "right", aiDistractor: false, count: count - leftCount - (aiCount - aiLeftCount) }
      ];
      return cellCounts.flatMap(cell =>
        Array.from({ length: cell.count }, () => ({
          isStop,
          direction: cell.direction,
          aiDistractor: cell.aiDistractor
        }))
      );
    }

    return shuffle([
      ...buildSubset(stopCount, true),
      ...buildSubset(goCount, false)
    ]);
  }

  function stopSignalTrial(definition, phase, block, trialInBlock) {
    let currentSSD = null;
    return {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <section class="gait-card compact rt-shell no-select">
          <div class="stop-ai-distractor ${definition.aiDistractor ? "active" : ""}">
            ${definition.aiDistractor ? "AI 提示：系统预测你会做出正确反应。" : ""}
          </div>
          <div id="stop-cue" class="stop-cue">停</div>
          <div class="arrow-stimulus">${definition.direction === "left" ? "←" : "→"}</div>
        </section>
      `,
      choices: ["f", "j"],
      response_ends_trial: true,
      trial_duration: 1000,
      post_trial_gap: 250,
      data: baseData("STOP_SIGNAL", phase, {
        block,
        trialInBlock,
        trialType: definition.isStop ? "stop" : "go",
        direction: definition.direction,
        aiDistractor: Boolean(definition.aiDistractor),
        correctKey: definition.direction === "left" ? "f" : "j"
      }),
      on_start: function(trial) {
        currentSSD = definition.isStop ? state.stopSSD : null;
        trial.data.stopSignalDelayMs = currentSSD;
      },
      on_load: function() {
        if (!definition.isStop) return;
        jsPsych.pluginAPI.setTimeout(function() {
          const cue = document.getElementById("stop-cue");
          if (cue) cue.classList.add("active");
        }, currentSSD);
      },
      on_finish: function(data) {
        const responded = data.response !== null;
        if (definition.isStop) {
          data.inhibitionSuccess = !responded;
          data.correct = !responded;
          data.responseBeforeStopSignal = responded && Number.isFinite(data.rt) && data.rt < currentSSD;
          if (!responded) state.stopSSD = Math.min(700, state.stopSSD + 50);
          else state.stopSSD = Math.max(100, state.stopSSD - 50);
          data.nextStopSignalDelayMs = state.stopSSD;
        } else {
          data.inhibitionSuccess = null;
          data.correct = responded && data.response === data.correctKey;
          data.goOmission = !responded;
          data.goCommissionError = responded && data.response !== data.correctKey;
        }
      }
    };
  }

  function writeStopSummary() {
    const rows = jsPsych.data.get().filterCustom(row =>
      row.taskName === "STOP_SIGNAL" && row.phase === "formal"
    ).values();

    function conditionMetrics(subset) {
      const goRows = subset.filter(row => row.trialType === "go");
      const stopRows = subset.filter(row => row.trialType === "stop");
      const correctGoRTs = goRows.filter(row => row.correct && Number.isFinite(row.rt)).map(row => row.rt);
      const pRespond = stopRows.length
        ? stopRows.filter(row => !row.inhibitionSuccess).length / stopRows.length
        : null;
      const meanSSD = mean(stopRows.map(row => row.stopSignalDelayMs));
      const integrationRT = Number.isFinite(pRespond) ? quantile(correctGoRTs, pRespond) : null;
      const ssrt = Number.isFinite(integrationRT) && Number.isFinite(meanSSD) ? integrationRT - meanSSD : null;
      const goOmissionRate = goRows.length ? goRows.filter(row => row.goOmission).length / goRows.length : null;
      const ssrtValid =
        Number.isFinite(pRespond) && pRespond >= 0.25 && pRespond <= 0.75 &&
        Number.isFinite(goOmissionRate) && goOmissionRate <= 0.10 &&
        Number.isFinite(ssrt) && ssrt >= 0;
      return {
        trialCount: subset.length,
        goTrialCount: goRows.length,
        stopTrialCount: stopRows.length,
        goAccuracy: goRows.length ? round(goRows.filter(row => row.correct).length / goRows.length) : null,
        goOmissionRate: round(goOmissionRate),
        meanCorrectGoRT: round(mean(correctGoRTs), 1),
        stopRespondRate: round(pRespond),
        stopSuccessRate: stopRows.length ? round(stopRows.filter(row => row.inhibitionSuccess).length / stopRows.length) : null,
        meanStopSignalDelayMs: round(meanSSD, 1),
        ssrtRawIntegrationEstimateMs: round(ssrt, 1),
        ssrtIntegrationEstimateMs: ssrtValid ? round(ssrt, 1) : null,
        ssrtValid
      };
    }

    const overall = conditionMetrics(rows);
    const withAI = conditionMetrics(rows.filter(row => row.aiDistractor === true));
    const withoutAI = conditionMetrics(rows.filter(row => row.aiDistractor === false));

    writeSummary("STOP_SIGNAL", {
      formalTrialCount: rows.length,
      goAccuracy: overall.goAccuracy,
      goOmissionRate: overall.goOmissionRate,
      meanCorrectGoRT: overall.meanCorrectGoRT,
      medianCorrectGoRT: round(median(rows.filter(row =>
        row.trialType === "go" && row.correct && Number.isFinite(row.rt)
      ).map(row => row.rt)), 1),
      stopRespondRate: overall.stopRespondRate,
      meanStopSignalDelayMs: overall.meanStopSignalDelayMs,
      ssrtRawIntegrationEstimateMs: overall.ssrtRawIntegrationEstimateMs,
      ssrtIntegrationEstimateMs: overall.ssrtIntegrationEstimateMs,
      ssrtValid: overall.ssrtValid,
      ssrtValidityRule: "stopRespondRate 0.25-0.75; goOmissionRate <= 0.10; SSRT >= 0",
      ssrtMethod: "integration_quantile_goRT_minus_meanSSD",
      aiDistractorDesign: "固定无答案AI横条；在go/stop试次内各约50%平衡",
      aiDistractorMetricsJson: JSON.stringify({ withAI, withoutAI }),
      aiGoRTCostMs: Number.isFinite(withAI.meanCorrectGoRT) && Number.isFinite(withoutAI.meanCorrectGoRT)
        ? round(withAI.meanCorrectGoRT - withoutAI.meanCorrectGoRT, 1) : null,
      aiGoAccuracyChange: Number.isFinite(withAI.goAccuracy) && Number.isFinite(withoutAI.goAccuracy)
        ? round(withAI.goAccuracy - withoutAI.goAccuracy) : null,
      aiStopSuccessChange: Number.isFinite(withAI.stopSuccessRate) && Number.isFinite(withoutAI.stopSuccessRate)
        ? round(withAI.stopSuccessRate - withoutAI.stopSuccessRate) : null,
      aiSSRTChangeMs: withAI.ssrtValid && withoutAI.ssrtValid
        ? round(withAI.ssrtIntegrationEstimateMs - withoutAI.ssrtIntegrationEstimateMs, 1) : null,
      aiConditionSSRTStatus: "探索性指标：每个条件的stop试次数较少，正式解释前需检查稳定性"
    });
  }

  function stopSignalModule(moduleNumber) {
    const timeline = [
      moduleIntro(
        moduleNumber,
        "反应抑制：Stop-Signal",
        "测量在快速反应过程中停止动作的能力。",
        `<div class="rule-grid">
          <div class="rule-item"><h3>普通箭头</h3><p>看到左箭头按 <span class="key-chip">F</span>，看到右箭头按 <span class="key-chip">J</span>。请尽量又快又准。</p></div>
          <div class="rule-item"><h3>出现红色“停”</h3><p>少数箭头出现后会再显示红色“停”。一旦看到“停”，本题就<strong>不要按任何键</strong>。</p></div>
          <div class="rule-item"><h3>AI 横条</h3><p>部分试次会出现固定的 AI 提示横条。它不提供答案，请忽略横条，仍按箭头和“停”的规则作答。</p></div>
          <div class="rule-item"><h3>最重要的要求</h3><p>不要故意放慢速度等待“停”字。普通箭头立即反应；看到“停”时尽力收住动作。</p></div>
        </div>`

    const resetPractice = simpleMessage(

    );
    resetPractice.on_start = () => { state.stopSSD = 250; };
    timeline.push(resetPractice);

    balancedStopDefinitions(CONFIG.stopPracticeTrials, true, 0).forEach((definition, index) => {
      timeline.push(fixationTrial("STOP_SIGNAL", "practice", 300));
      timeline.push(stopSignalTrial(definition, "practice", 0, index + 1));
      timeline.push(practiceFeedback("STOP_SIGNAL", function(row) {
        if (row.trialType === "stop") {
          return row.inhibitionSuccess
            ? '<div class="success-text">成功停住</div>'
            : '<div class="error-text">这次按键了；看到“停”时请忍住不按。</div>';
        }
        if (row.goOmission) return '<div class="error-text">漏答：有方向箭头时要尽快按键。</div>';
        return row.correct
          ? '<div class="success-text">正确</div>'
          : '<div class="error-text">按错方向：左 F，右 J。</div>';
      }, 600));
    });

    const formalStart = simpleMessage(
      "练习结束",
      "<p>接下来是正式任务，不再显示对错。请保持同样速度，不要等待“停”字。</p>",
      "开始正式任务"
    );
    formalStart.on_start = () => { state.stopSSD = 250; };
    timeline.push(formalStart);

    for (let block = 1; block <= CONFIG.stopBlocks; block++) {
      const definitions = balancedStopDefinitions(CONFIG.stopTrialsPerBlock, true, block);
      definitions.forEach((definition, index) => {
        timeline.push(fixationTrial("STOP_SIGNAL", "formal", 250 + Math.floor(Math.random() * 151)));
        timeline.push(stopSignalTrial(definition, "formal", block, index + 1));
      });
      if (block < CONFIG.stopBlocks) {
        timeline.push(simpleMessage(
          "本区组完成",
          "<p>短暂放松手指，准备好后继续。仍然要尽快反应，不要等停止信号。</p>",
          "继续下一组",
          { taskName: "STOP_SIGNAL", blockBreakAfter: block }
        ));
      }
    }
    timeline.push(moduleComplete("反应抑制", writeStopSummary));
    return timeline;
  }

  function generateNBackSequence(n, length, targetRate = 0.30) {
    const symbols = ["2", "3", "4", "5", "6", "7", "8", "9"];
    const eligible = Array.from({ length: Math.max(0, length - n) }, (_, i) => i + n);
    const targetCount = eligible.length
      ? Math.min(eligible.length, Math.max(1, Math.round(eligible.length * targetRate)))
      : 0;
    const targetPositions = new Set(shuffle(eligible).slice(0, targetCount));
    const sequence = [];
    for (let i = 0; i < length; i++) {
      if (i >= n && targetPositions.has(i)) {
        sequence.push(sequence[i - n]);
      } else {
        const forbidden = i >= n ? sequence[i - n] : null;
        sequence.push(shuffle(symbols.filter(symbol => symbol !== forbidden))[0]);
      }
    }
    return sequence.map((symbol, index) => {
      const isStarter = index < n;
      const comparisonSymbol = isStarter ? null : sequence[index - n];
      const target = isStarter ? null : symbol === comparisonSymbol;
      return {
        symbol,
        comparisonSymbol,
        isStarter,
        scorable: !isStarter,
        target,
        correctKey: isStarter ? null : (target ? "j" : "f"),
        position: index + 1
      };
    });
  }

  function nBackTrial(item, n, phase, block) {
    const responsePrompt = item.isStarter
      ? `序列开始：请先记住这个数字，不需要按键`
      : `按 F＝不同　·　按 J＝相同`;
    return {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <section class="gait-card compact rt-shell no-select">
          <div class="module-pill">${n}-back 工作记忆</div>
          <div class="rt-map">${responsePrompt}</div>
          <div id="nback-stimulus" class="nback-stimulus">${item.symbol}</div>
        </section>
      `,
      choices: item.isStarter ? "NO_KEYS" : ["f", "j"],
      response_ends_trial: false,
      trial_duration: 1700,
      post_trial_gap: 200,
      data: baseData("NBACK", phase, {
        nLevel: n,
        block,
        position: item.position,
        stimulusSymbol: item.symbol,
        comparisonSymbol: item.comparisonSymbol,
        isStarter: item.isStarter,
        scorable: item.scorable,
        responseRequired: !item.isStarter,
        target: item.target,
        correctKey: item.correctKey
      }),
      on_load: function() {
        jsPsych.pluginAPI.setTimeout(function() {
          const stimulus = document.getElementById("nback-stimulus");
          if (stimulus) stimulus.textContent = "";
        }, 600);
      },
      on_finish: function(data) {
        const pressed = data.response !== null;
        data.pressed = pressed;
        Object.assign(data, scoreNBackResponse(data.isStarter, data.target, data.response));
      }
    };
  }

  function scoreNBackResponse(isStarter, target, response) {
    if (isStarter) return { outcome: "starter", correct: null };
    if (response === null) return { outcome: "omission", correct: false };
    if (target === true && response === "j") return { outcome: "hit", correct: true };
    if (target === true) return { outcome: "miss", correct: false };
    if (response === "j") return { outcome: "false_alarm", correct: false };
    return { outcome: "correct_rejection", correct: true };
  }

  function nBackPracticeFeedbackText(row, n) {
    if (row.isStarter) {
      return `<div class="success-text">记忆开始数字：${escapeHTML(row.stimulusSymbol)}</div>
        <p>这是序列的起始数字，还不能进行 ${n}-back 比较，所以不需要按键。</p>`;
    }
    const relation = row.target ? "相同" : "不同";
    const expectedKey = row.target ? "J" : "F";
    const comparison = `当前数字 ${escapeHTML(row.stimulusSymbol)} 与前面第 ${n} 个数字 ${escapeHTML(row.comparisonSymbol)} ${relation}`;
    if (row.correct) {
      return `<div class="success-text">正确</div><p>${comparison}，所以应该按 ${expectedKey}。</p>`;
    }
    if (row.outcome === "omission") {
      return `<div class="error-text">未检测到按键</div><p>${comparison}，正确按键是 ${expectedKey}。每个可判断数字都要作答。</p>`;
    }
    return `<div class="error-text">错误</div><p>${comparison}，正确按键是 ${expectedKey}。</p>`;
  }

  function inverseNormal(probability) {
    if (!(probability > 0 && probability < 1)) return null;
    const a = [-39.6968302866538, 220.946098424521, -275.928510446969, 138.357751867269, -30.6647980661472, 2.50662827745924];
    const b = [-54.4760987982241, 161.585836858041, -155.698979859887, 66.8013118877197, -13.2806815528857];
    const c = [-0.00778489400243029, -0.322396458041136, -2.40075827716184, -2.54973253934373, 4.37466414146497, 2.93816398269878];
    const d = [0.00778469570904146, 0.32246712907004, 2.445134137143, 3.75440866190742];
    const low = 0.02425;
    const high = 1 - low;
    let q;
    let r;
    if (probability < low) {
      q = Math.sqrt(-2 * Math.log(probability));
      return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
        ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    }
    if (probability > high) {
      q = Math.sqrt(-2 * Math.log(1 - probability));
      return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
        ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    }
    q = probability - 0.5;
    r = q * q;
    return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q /
      (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
  }

  function nBackMetrics(rows) {
    const scoredRows = rows.filter(row => row.scorable === true && row.isStarter !== true);
    const targets = scoredRows.filter(row => row.target === true);
    const nonTargets = scoredRows.filter(row => row.target === false);
    const hits = targets.filter(row => row.outcome === "hit").length;
    const falseAlarms = nonTargets.filter(row => row.outcome === "false_alarm").length;
    const omissions = scoredRows.filter(row => row.outcome === "omission").length;
    const omissionRate = scoredRows.length ? omissions / scoredRows.length : null;
    const hitRateCorrected = (hits + 0.5) / (targets.length + 1);
    const faRateCorrected = (falseAlarms + 0.5) / (nonTargets.length + 1);
    const dPrime = inverseNormal(hitRateCorrected) - inverseNormal(faRateCorrected);
    const dPrimeValid = Number.isFinite(omissionRate) && omissionRate <= 0.10;
    return {
      trials: rows.length,
      scoredTrials: scoredRows.length,
      starterTrials: rows.length - scoredRows.length,
      targetCount: targets.length,
      hitRate: targets.length ? round(hits / targets.length) : null,
      falseAlarmRate: nonTargets.length ? round(falseAlarms / nonTargets.length) : null,
      omissionRate: round(omissionRate),
      accuracy: scoredRows.length ? round(scoredRows.filter(row => row.correct).length / scoredRows.length) : null,
      meanHitRT: round(mean(scoredRows.filter(row => row.outcome === "hit").map(row => row.rt)), 1),
      meanCorrectRT: round(mean(scoredRows.filter(row => row.correct).map(row => row.rt)), 1),
      dPrimeLoglinear: dPrimeValid ? round(dPrime) : null,
      dPrimeValid,
      dPrimeValidityRule: "omissionRate <= 0.10"
    };
  }

  function writeNBackSummary() {
    const rows = jsPsych.data.get().filterCustom(row =>
      row.taskName === "NBACK" && row.phase === "formal"
    ).values();
    const oneBack = nBackMetrics(rows.filter(row => row.nLevel === 1));
    const twoBack = nBackMetrics(rows.filter(row => row.nLevel === 2));
    writeSummary("NBACK", {
      formalTrialCount: rows.length,
      scoredFormalTrialCount: oneBack.scoredTrials + twoBack.scoredTrials,
      oneBackJson: JSON.stringify(oneBack),
      twoBackJson: JSON.stringify(twoBack),
      oneBackDPrime: oneBack.dPrimeLoglinear,
      twoBackDPrime: twoBack.dPrimeLoglinear,
      oneBackDPrimeValid: oneBack.dPrimeValid,
      twoBackDPrimeValid: twoBack.dPrimeValid,
      oneBackOmissionRate: oneBack.omissionRate,
      twoBackOmissionRate: twoBack.omissionRate,
      overallAccuracy: oneBack.scoredTrials + twoBack.scoredTrials
        ? round((
          rows.filter(row => row.scorable === true && row.correct === true).length
        ) / (oneBack.scoredTrials + twoBack.scoredTrials))
        : null
    });
  }

    generateNBackSequence(2, CONFIG.nbackTwoBackPracticeTrials, 0.35).forEach(item => {

    });

    timeline.push(simpleMessage(
      "2-back 正式任务",
      "<p>练习结束。接下来保持 2-back 规则：不同按 F，相同按 J。除最开始两个记忆数字外，每题都要按键。正式任务不再显示反馈。</p>",
      "开始 2-back 正式任务"
    ));

    generateNBackSequence(2, CONFIG.nbackTrialsPerLevel, 0.30).forEach(item => {
      timeline.push(nBackTrial(item, 2, "formal", 2));
    });
    timeline.push(moduleComplete("工作记忆", writeNBackSummary));

  }

  const SWITCH_STIMULI = Object.freeze([
    { color: "orange", shape: "circle" },
    { color: "orange", shape: "triangle" },
    { color: "blue", shape: "circle" },
    { color: "blue", shape: "triangle" }
  ]);

  function switchCorrectKey(rule, stimulus) {
    if (rule === "color") return stimulus.color === "orange" ? "f" : "j";
    return stimulus.shape === "circle" ? "f" : "j";
  }

  function switchTrial(rule, stimulus, phase, blockType, transition, block, trialInBlock) {
    const shapeHTML = stimulus.shape === "circle"
      ? `<div class="shape-circle ${stimulus.color}"></div>`
      : `<div class="shape-triangle ${stimulus.color}"></div>`;
    return {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <section class="gait-card compact rt-shell no-select">
          <div class="switch-cue">规则：${rule === "color" ? "颜色" : "形状"}</div>
          <div class="rt-map">颜色：橙 F / 蓝 J　　形状：圆 F / 三角 J</div>
          <div class="switch-shape-wrap">${shapeHTML}</div>
        </section>
      `,
      choices: ["f", "j"],
      response_ends_trial: true,
      trial_duration: 1600,
      post_trial_gap: 250,
      data: baseData("TASK_SWITCH", phase, {
        rule,
        stimulusColor: stimulus.color,
        stimulusShape: stimulus.shape,
        blockType,
        transition,
        block,
        trialInBlock,
        correctKey: switchCorrectKey(rule, stimulus)
      }),
      on_finish: function(data) {
        data.correct = data.response !== null && data.response === data.correctKey;
        data.omission = data.response === null;
        data.congruency =
          (data.stimulusColor === "orange" && data.stimulusShape === "circle") ||
          (data.stimulusColor === "blue" && data.stimulusShape === "triangle")
            ? "congruent" : "incongruent";
      }
    };
  }

  function repeatStimuli(total) {
    const result = [];
    for (let i = 0; i < total; i++) result.push(SWITCH_STIMULI[i % SWITCH_STIMULI.length]);
    return shuffle(result);
  }

  function mixedRuleSequence(total) {
    const rules = [Math.random() < 0.5 ? "color" : "shape"];
    let repeatsInRow = 0;
    for (let i = 1; i < total; i++) {
      let shouldSwitch = Math.random() < 0.5;
      if (repeatsInRow >= 2) shouldSwitch = true;
      if (shouldSwitch) {
        rules.push(rules[i - 1] === "color" ? "shape" : "color");
        repeatsInRow = 0;
      } else {
        rules.push(rules[i - 1]);
        repeatsInRow += 1;
      }
    }
    return rules;
  }

  function writeSwitchSummary() {
    const rows = jsPsych.data.get().filterCustom(row =>
      row.taskName === "TASK_SWITCH" && row.phase === "formal"
    ).values();
    const correct = rows.filter(row => row.correct && Number.isFinite(row.rt) && row.rt >= 150);
    const pureRT = mean(correct.filter(row => row.blockType === "pure").map(row => row.rt));
    const repeatRT = mean(correct.filter(row => row.blockType === "mixed" && row.transition === "repeat").map(row => row.rt));
    const switchRT = mean(correct.filter(row => row.blockType === "mixed" && row.transition === "switch").map(row => row.rt));
    writeSummary("TASK_SWITCH", {
      formalTrialCount: rows.length,
      overallAccuracy: rows.length ? round(rows.filter(row => row.correct).length / rows.length) : null,
      meanPureRT: round(pureRT, 1),
      meanMixedRepeatRT: round(repeatRT, 1),
      meanMixedSwitchRT: round(switchRT, 1),
      switchCostMs: Number.isFinite(switchRT) && Number.isFinite(repeatRT) ? round(switchRT - repeatRT, 1) : null,
      mixedCostMs: Number.isFinite(repeatRT) && Number.isFinite(pureRT) ? round(repeatRT - pureRT, 1) : null,
      errorRate: rows.length ? round(rows.filter(row => !row.correct).length / rows.length) : null
    });
  }

  function taskSwitchModule(moduleNumber) {
    const timeline = [
      moduleIntro(
        moduleNumber,
        "认知灵活性：任务切换",
        "测量在两套规则之间快速切换的能力。",
        `<div class="rule-grid">
          <div class="rule-item"><h3>先看上方规则</h3><p>每题最上方会写“颜色”或“形状”。必须先读规则，再判断中间的图形。</p></div>
          <div class="rule-item"><h3>颜色规则</h3><p>橙色按 <span class="key-chip">F</span>，蓝色按 <span class="key-chip">J</span>，此时忽略形状。</p></div>
          <div class="rule-item"><h3>形状规则</h3><p>圆形按 <span class="key-chip">F</span>，三角形按 <span class="key-chip">J</span>，此时忽略颜色。</p></div>
          <div class="rule-item"><h3>混合区组</h3><p>后面的规则可能每题变化。不要沿用上一题规则，每次都重新看提示。</p></div>
        </div>`
      ),
      simpleMessage(
        "规则练习",
        "<p><strong>颜色规则：</strong>橙 F，蓝 J。<br><strong>形状规则：</strong>圆 F，三角 J。</p>",
        "开始练习"
      )
    ];

    const practicePureCount = DEMO_MODE ? 2 : 4;
    ["color", "shape"].forEach((rule, ruleIndex) => {
      repeatStimuli(practicePureCount).forEach((stimulus, index) => {
        timeline.push(switchTrial(rule, stimulus, "practice", "pure", "pure", ruleIndex + 1, index + 1));
        timeline.push(practiceFeedback("TASK_SWITCH", row => row.correct
          ? '<div class="success-text">正确</div>'
          : '<div class="error-text">请先看上方规则，再按对应键。</div>', 500));
      });
    });

    const mixedPracticeRules = mixedRuleSequence(DEMO_MODE ? 4 : 8);
    repeatStimuli(mixedPracticeRules.length).forEach((stimulus, index) => {
      const transition = index === 0 ? "first" :
        (mixedPracticeRules[index] === mixedPracticeRules[index - 1] ? "repeat" : "switch");
      timeline.push(switchTrial(mixedPracticeRules[index], stimulus, "practice", "mixed", transition, 3, index + 1));
      timeline.push(practiceFeedback("TASK_SWITCH", row => row.correct
        ? '<div class="success-text">正确</div>'
        : '<div class="error-text">规则可能变化，请每题都先看提示。</div>', 500));
    });

    timeline.push(simpleMessage(
      "正式任务",
      "<p>先完成两个单规则区组，再进入混合规则区组。正式任务不再显示反馈。</p>",
      "开始正式任务"
    ));

    function pureBlockTimeline(ruleOrder) {
      const trials = [];
      ruleOrder.forEach((rule, blockIndex) => {
        repeatStimuli(CONFIG.switchPureTrials).forEach((stimulus, index) => {
          trials.push(switchTrial(rule, stimulus, "formal", "pure", "pure", blockIndex + 1, index + 1));
        });
      });
      return trials;
    }

    timeline.push({
      timeline: pureBlockTimeline(["color", "shape"]),
      conditional_function: () => state.orderGroup === "A"
    });
    timeline.push({
      timeline: pureBlockTimeline(["shape", "color"]),
      conditional_function: () => state.orderGroup === "B"
    });

    const rules = mixedRuleSequence(CONFIG.switchMixedTrials);
    repeatStimuli(rules.length).forEach((stimulus, index) => {
      const transition = index === 0 ? "first" : (rules[index] === rules[index - 1] ? "repeat" : "switch");
      timeline.push(switchTrial(rules[index], stimulus, "formal", "mixed", transition, 3, index + 1));
    });

    timeline.push(moduleComplete("认知灵活性", writeSwitchSummary));
    return timeline;
  }

  function optionRows(name, options) {
    return options.map((option, index) => `
      <label class="choice-row">
        <input type="radio" name="${name}" value="${index}">
        <span><strong>${String.fromCharCode(65 + index)}.</strong> ${escapeHTML(option)}</span>
      </label>
    `).join("");
  }

  function rotateChoiceItem(item, shift) {
    const count = item.options.length;
    const normalizedShift = ((shift % count) + count) % count;
    const options = Array(count);
    const optionOrderOriginalIndices = Array(count);
    item.options.forEach((option, originalIndex) => {
      const displayedIndex = (originalIndex + normalizedShift) % count;
      options[displayedIndex] = option;
      optionOrderOriginalIndices[displayedIndex] = originalIndex;
    });
    return {
      ...item,
      options,
      correctIndex: (item.correctIndex + normalizedShift) % count,
      aiChoiceIndex: Number.isInteger(item.aiChoiceIndex)
        ? (item.aiChoiceIndex + normalizedShift) % count
        : null,
      optionOrderOriginalIndices
    };
  }

  function remapChoiceItem(item, desiredAIPosition, desiredCorrectPosition) {
    const count = item.options.length;
    const originalOrder = Array.from({ length: count }, (_, index) => index);
    const displayedOriginalIndices = Array(count).fill(null);
    displayedOriginalIndices[desiredAIPosition] = item.aiChoiceIndex;
    displayedOriginalIndices[desiredCorrectPosition] = item.correctIndex;

    const alreadyPlaced = new Set(displayedOriginalIndices.filter(Number.isInteger));
    const remainingOriginalIndices = shuffle(originalOrder.filter(index => !alreadyPlaced.has(index)));
    displayedOriginalIndices.forEach((originalIndex, displayedIndex) => {
      if (!Number.isInteger(originalIndex)) displayedOriginalIndices[displayedIndex] = remainingOriginalIndices.shift();
    });

    return {
      ...item,
      options: displayedOriginalIndices.map(originalIndex => item.options[originalIndex]),
      correctIndex: displayedOriginalIndices.indexOf(item.correctIndex),
      aiChoiceIndex: displayedOriginalIndices.indexOf(item.aiChoiceIndex),
      optionOrderOriginalIndices: displayedOriginalIndices
    };
  }

  function balanceAIAdviceOptions(items) {
    const shuffledItems = shuffle(items);
    if (shuffledItems.length !== 8) {
      return shuffledItems.map((item, index) => {
        const desiredAIPosition = index % 4;
        return rotateChoiceItem(item, desiredAIPosition - item.aiChoiceIndex);
      });
    }

    const aiRemaining = [2, 2, 2, 2];
    const correctRemaining = [2, 2, 2, 2];
    const assignedPositions = Array(shuffledItems.length).fill(null);

    function assign(index) {
      if (index === shuffledItems.length) return true;
      const item = shuffledItems[index];
      const sameAnswer = item.correctIndex === item.aiChoiceIndex;
      const aiCandidates = shuffle([0, 1, 2, 3]).filter(position => aiRemaining[position] > 0);
      for (const aiPosition of aiCandidates) {
        const correctCandidates = shuffle([0, 1, 2, 3]).filter(correctPosition =>
          correctRemaining[correctPosition] > 0 &&
          (sameAnswer ? correctPosition === aiPosition : correctPosition !== aiPosition)
        );
        for (const correctPosition of correctCandidates) {
          aiRemaining[aiPosition] -= 1;
          correctRemaining[correctPosition] -= 1;
          assignedPositions[index] = { aiPosition, correctPosition };
          if (assign(index + 1)) return true;
          aiRemaining[aiPosition] += 1;
          correctRemaining[correctPosition] += 1;
        }
      }
      return false;
    }

    if (!assign(0)) {
      return shuffledItems.map((item, index) =>
        rotateChoiceItem(item, (index % 4) - item.aiChoiceIndex)
      );
    }
    return shuffledItems.map((item, index) => remapChoiceItem(
      item,
      assignedPositions[index].aiPosition,
      assignedPositions[index].correctPosition
    ));
  }

  function aiAdviceTrial(item, phase) {
    const independentDuration = phase === "practice"
      ? Math.min(20000, CONFIG.aiAdviceIndependentMs)
      : CONFIG.aiAdviceIndependentMs;
    const reviewDuration = phase === "practice"
      ? Math.min(25000, CONFIG.aiAdviceReviewMs)
      : CONFIG.aiAdviceReviewMs;
    return {
      type: jsPsychHtmlKeyboardResponse,
      choices: "NO_KEYS",
      stimulus: '<div id="ai-advice-root"></div>',
      data: baseData("AI_ADVICE", phase, {
        itemId: item.id,
        questionText: item.question,
        optionsJson: JSON.stringify(item.options),
        correctIndex: item.correctIndex,
        aiSuggestionText: item.aiText,
        aiChoiceIndex: item.aiChoiceIndex,
        adviceType: item.adviceType,
        expectedDecision: item.expectedDecision,
        optionOrderOriginalIndicesJson: JSON.stringify(item.optionOrderOriginalIndices || [0, 1, 2, 3]),
        independentTimeLimitMs: independentDuration,
        reviewTimeLimitMs: reviewDuration
      }),
      on_load: function() {
        const root = document.getElementById("ai-advice-root");
        const started = performance.now();
        let deadline = started + independentDuration;
        let stage = 1;
        let stage2Started = null;
        let initialChoice = null;
        let initialConfidence = null;
        let initialRT = null;
        let initialTimedOut = false;
        let finished = false;
        let interval = null;

        function timerHTML() {
          return '<span id="ai-timer" class="timer"></span>';
        }

        function renderStage1() {
          root.innerHTML = `
            <section class="gait-card">
              <div class="trial-head"><h2 style="margin:0;">先独立作答</h2>${timerHTML()}</div>
              <div class="material-box"><strong>问题：</strong>${escapeHTML(item.question)}</div>
              <div>${optionRows("initial-choice", item.options)}</div>
              <div class="confidence-wrap">
                <label class="field-label">你对这个答案有多大信心？ <strong id="initial-confidence-value">50</strong>%</label>
                <input id="initial-confidence" type="range" min="0" max="100" step="5" value="50">
                <div class="range-labels"><span>0 完全没把握</span><span>100 非常有把握</span></div>
              </div>
              <div id="ai-error" class="error-text"></div>
              <button id="initial-next" class="gait-btn" type="button">提交独立答案，查看 AI 建议</button>
            </section>
          `;
          const range = document.getElementById("initial-confidence");
          range.addEventListener("input", () => { document.getElementById("initial-confidence-value").textContent = range.value; });
          document.getElementById("initial-next").addEventListener("click", () => advanceToStage2(false));
          updateTimer();
        }

        function advanceToStage2(timedOut) {
          if (stage !== 1 || finished) return;
          const choice = document.querySelector('input[name="initial-choice"]:checked');
          if (!timedOut && !choice) {
            document.getElementById("ai-error").textContent = "请先选择一个答案。";
            return;
          }
          const range = document.getElementById("initial-confidence");
          initialChoice = choice ? Number(choice.value) : null;
          initialConfidence = range ? Number(range.value) : null;
          initialRT = performance.now() - started;
          initialTimedOut = timedOut;
          stage = 2;
          stage2Started = performance.now();
          deadline = stage2Started + reviewDuration;
          renderStage2();
          updateTimer();
        }

        function renderStage2() {
          root.innerHTML = `
            <section class="gait-card">
              <div class="trial-head"><h2 style="margin:0;">判断并处理 AI 建议</h2>${timerHTML()}</div>
              <div class="material-box"><strong>原问题：</strong>${escapeHTML(item.question)}</div>
              <p class="muted">你的独立答案：<strong>${initialChoice === null ? "未在限时内作答" : escapeHTML(item.options[initialChoice])}</strong></p>
              <div class="ai-box">
                <div class="strong">以下是预先生成的 AI 建议，它不一定正确：</div>
                <p>${escapeHTML(item.aiText)}</p>
              </div>
              <label class="field-label">你如何处理这条建议？</label>
              ${optionRows("advice-decision", ["采纳", "部分采纳并补充条件", "拒绝"])}
              <label class="field-label">阅读建议后，你的最终答案是：</label>
              ${optionRows("final-choice", item.options)}
              <label class="field-label" for="advice-reason">请说明你采纳、部分采纳或拒绝的理由 *</label>
              <textarea id="advice-reason" maxlength="500" placeholder="说明依据、条件或发现的问题；不要只写“因为 AI 对/错”。"></textarea>
              <div class="confidence-wrap">
                <label class="field-label">现在的信心：<strong id="final-confidence-value">${initialConfidence ?? 50}</strong>%</label>
                <input id="final-confidence" type="range" min="0" max="100" step="5" value="${initialConfidence ?? 50}">
                <div class="range-labels"><span>0 完全没把握</span><span>100 非常有把握</span></div>
              </div>
              <div id="ai-error" class="error-text"></div>
              <button id="final-submit" class="gait-btn" type="button">提交本题</button>
            </section>
          `;
          const range = document.getElementById("final-confidence");
          range.addEventListener("input", () => { document.getElementById("final-confidence-value").textContent = range.value; });
          document.getElementById("final-submit").addEventListener("click", () => finish(false));
        }

        function checkedValue(name) {
          const input = document.querySelector('input[name="' + name + '"]:checked');
          return input ? Number(input.value) : null;
        }

        function finish(timedOut) {
          if (finished) return;
          if (stage !== 2) {
            advanceToStage2(true);
            return;
          }
          const finalChoice = checkedValue("final-choice");
          const decisionIndex = checkedValue("advice-decision");
          const reason = document.getElementById("advice-reason").value.trim();
          const finalConfidence = Number(document.getElementById("final-confidence").value);
          if (!timedOut && (finalChoice === null || decisionIndex === null || reason.length < 5)) {
            document.getElementById("ai-error").textContent = "请选择处理方式和最终答案，并用至少 5 个字说明理由。";
            return;
          }

          finished = true;
          if (interval) clearInterval(interval);
          const decisionMap = ["adopt", "partial", "reject"];
          const decision = decisionIndex === null ? null : decisionMap[decisionIndex];
          const isErroneousAdvice = item.adviceType === "calculation_error" || item.adviceType === "logical_fallacy";
          jsPsych.finishTrial({
            initialChoice,
            initialChoiceLabel: initialChoice === null ? null : item.options[initialChoice],
            initialCorrect: initialChoice === null ? null : initialChoice === item.correctIndex,
            initialConfidence,
            initialRT: round(initialRT, 1),
            stageReached: stage,
            decision,
            decisionAppropriate: decision === null ? null : decision === item.expectedDecision,
            finalChoice,
            finalChoiceLabel: finalChoice === null ? null : item.options[finalChoice],
            finalCorrect: finalChoice === null ? null : finalChoice === item.correctIndex,
            answerChanged: finalChoice !== null && initialChoice !== null ? finalChoice !== initialChoice : null,
            reason,
            reasonLength: reason.length,
            finalConfidence,
            stage2RT: stage2Started === null ? null : round(performance.now() - stage2Started, 1),
            totalRT: round(performance.now() - started, 1),
            blindAdoption: finalChoice === null ? null : isErroneousAdvice && finalChoice === item.aiChoiceIndex,
            initialTimedOut,
            reviewTimedOut: timedOut,
            timedOut: initialTimedOut || timedOut
          });
        }

        function updateTimer() {
          const timer = document.getElementById("ai-timer");
          if (!timer) return;
          const remaining = deadline - performance.now();
          timer.textContent = formatTime(remaining);
          timer.classList.toggle("urgent", remaining <= 10000);
          if (remaining <= 0) {
            if (stage === 1) advanceToStage2(true);
            else finish(true);
          }
        }

        renderStage1();
        interval = setInterval(updateTimer, 150);
      }
    };
  }

  function writeAIAdviceSummary() {
    const rows = jsPsych.data.get().filterCustom(row =>
      row.taskName === "AI_ADVICE" && row.phase === "formal"
    ).values();
    const correctAdvice = rows.filter(row => row.adviceType === "correct");
    const errorAdvice = rows.filter(row => row.adviceType === "calculation_error" || row.adviceType === "logical_fallacy");
    const partialAdvice = rows.filter(row => row.adviceType === "partially_reasonable");
    const initialCompleted = rows.filter(row => typeof row.initialCorrect === "boolean");
    const finalCompleted = rows.filter(row => typeof row.finalCorrect === "boolean");
    const pairedCompleted = rows.filter(row =>
      typeof row.initialCorrect === "boolean" && typeof row.finalCorrect === "boolean"
    );
    const decisionRate = (subset, predicate) => {
      const completed = subset.filter(row => typeof row.decision === "string");
      return completed.length ? round(completed.filter(predicate).length / completed.length) : null;
    };
    const booleanRate = (subset, field) => {
      const completed = subset.filter(row => typeof row[field] === "boolean");
      return completed.length ? round(completed.filter(row => row[field]).length / completed.length) : null;
    };
    writeSummary("AI_ADVICE", {
      formalItemCount: rows.length,
      initialCompletionRate: rows.length ? round(initialCompleted.length / rows.length) : null,
      finalCompletionRate: rows.length ? round(finalCompleted.length / rows.length) : null,
      initialAccuracy: initialCompleted.length ? round(initialCompleted.filter(row => row.initialCorrect).length / initialCompleted.length) : null,
      finalAccuracy: finalCompleted.length ? round(finalCompleted.filter(row => row.finalCorrect).length / finalCompleted.length) : null,
      revisionAccuracyGain: pairedCompleted.length
        ? round(mean(pairedCompleted.map(row => Number(row.finalCorrect) - Number(row.initialCorrect))))
        : null,
      reasonableAdoptionRate: decisionRate(correctAdvice, row => row.decision === "adopt"),
      errorRejectionRate: decisionRate(errorAdvice, row => row.decision === "reject"),
      partialAdviceSelectiveRate: decisionRate(partialAdvice, row => row.decision === "partial"),
      blindAdoptionRate: booleanRate(errorAdvice, "blindAdoption"),
      overallDecisionAppropriateRate: booleanRate(rows, "decisionAppropriate"),
      meanIndependentRT: round(mean(initialCompleted.map(row => row.initialRT)), 1),
      meanAIReviewRT: round(mean(finalCompleted.map(row => row.stage2RT)), 1),
      meanTotalRT: round(mean(rows.map(row => row.totalRT)), 1),
      meanReasonLength: round(mean(rows.map(row => row.reasonLength))),
      reasonScoringStatus: "理由质量待按证据、条件限制、逻辑解释和独立判断进行0-4级评分"
    });
  }

    ];
    const selectedItems = DEMO_MODE

    balanceAIAdviceOptions(selectedItems)
      .forEach(item => timeline.push(aiAdviceTrial(item, "formal")));
    timeline.push(moduleComplete("AI 建议采纳与错误识别", writeAIAdviceSummary));

  }
